# proxychains.conf  --  proxychains-ng (4.x) 配置文件
#
# 该文件会被打包进镜像的 /etc/proxychains.conf，启动命令为：
#     proxychains4 uv run python main.py
#
# == 使用前必读 ==
# 1. ProxyList 里「第一个」代理必须写成数字 IPv4，不能写主机名。
#    proxychains-ng 只在「链首之后的节点」才允许主机名，写错会直接退出：
#       proxy xxx has invalid value or is not numeric
#       non-numeric ips are only allowed: chaintype==strict,
#       proxy is not first in list, proxy_dns active
# 2. 容器内 127.0.0.1 是容器自己。要连宿主机上的代理，填宿主机在 docker0
#    网桥上的 IP（默认 172.17.0.1，用 `ip addr show docker0` 查看），
#    不要用 127.0.0.1。
# 3. 改完这个文件不用重新构建镜像：docker-compose 已把它以只读方式挂载到
#    /etc/proxychains.conf，重启容器即生效。
# 4. 若代理带账号密码，建议不要把本文件提交到公开仓库。

# ---------------------------------------------------------------------------
# 链模式
#   strict_chain  : 按 ProxyList 顺序串联，任一节点不可用则连接失败（推荐）
#   dynamic_chain : 自动跳过不可用的节点
#   random_chain  : 随机挑选节点
# ---------------------------------------------------------------------------
strict_chain

# ---------------------------------------------------------------------------
# 关键：让 DNS 解析也走代理
# 不开启时域名会在本地解析，既可能解析失败，也会泄露访问目标。
# ---------------------------------------------------------------------------
proxy_dns

# proxy_dns 用"假 IP"承载远程 DNS 结果，需保证该网段不与真实网段冲突
remote_dns_subnet 224

# ---------------------------------------------------------------------------
# 超时（毫秒）
# ---------------------------------------------------------------------------
tcp_read_time_out 15000
tcp_connect_time_out 8000

# localnet 段只在「传入的是裸 IP」或「关闭 proxy_dns」时生效
localnet 127.0.0.0/255.0.0.0
localnet 10.0.0.0/255.0.0.0
localnet 172.16.0.0/255.240.0.0
localnet 192.168.0.0/255.255.0.0

[ProxyList]
# 格式：type  host  port  [username]  [password]
# type 支持 http / socks4 / socks5 / raw
# host 必须是数字 IPv4（链首限制），不要写域名

# 默认：宿主机在 docker0 网桥上的 SOCKS5 代理
#       宿主机本机端口 10808 → 容器内写成 172.17.0.1:10808
socks5  172.17.0.1 10808

# 其它常见写法，按需替换上面那一行
# http     172.17.0.1 7890
# socks5   10.0.0.5   1080   username  password
